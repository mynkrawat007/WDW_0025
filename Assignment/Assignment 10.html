<!DOCTYPE html>
<html>
<body>
    <!-- Image element with semantic figure encapsulation -->
    <h3>Image</h3>
    <figure>
        <figcaption>College campus</figcaption>
        <img src="campus.jpg" alt="College Campus Image">
    </figure>

     <!-- Native HTML5 video embedding with user controls -->
    <h3>Video</h3>
    <video width="320" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Native HTML5 audio embedding with user controls -->
    <h3>Audio</h3>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <!-- External multimedia embedding via inline frame -->
    <h3>YouTube</h3>
    <iframe width="400" height="250" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube Video" frameborder="0" allowfullscreen></iframe>

    </body>
</html>
