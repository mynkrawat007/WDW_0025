<!DOCTYPE html>
<html>
<body>
    <!-- The action attribute targets the submission file, method defines data transmission -->
    <form action="submit.php" method="POST">
        
        <!-- Field enforcing completion before submission -->
        <input type="text" name="fullname" placeholder="Full name" required><br><br>
        
        <!-- Native email validation checking for the '@' character -->
        <input type="email" name="email" placeholder="you@college.edu" required><br><br>
        
        <!-- Regular expression pattern forcing exactly 10 digits -->
        <input type="text" name="mobile" placeholder="10-digit mobile" pattern="\d{10}" title="Enter exactly 10 digits" required><br><br>
        
        <!-- Minimum length constraint -->
        <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required><br><br>
        
        <!-- Number constraint enforcing maximum acceptable value -->
        <label for="age">Age</label>
        <input type="number" id="age" name="age" max="30" value="17" required><br><br>
        
        <button type="submit">Register</button>
    </form>
</body>
</html>
