<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>
</head>
<body>
    <!-- Structured semantic layout combining headings, tables, and forms -->
    <header>
        <h1 align="center">ABC College Admission 2026</h1>
    </header>
    
    <main>
        <h2>Courses and Fees</h2>
        <table border="1" width="100%">
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th scope="col">Course</th>
                    <th scope="col">Seats</th>
                    <th scope="col">Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>
        
        
        <br>
        
        <form action="apply.php" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                
                <label for="appName">Name:</label><br>
                <input type="text" id="appName" name="appName" required><br><br>
                
                <label for="appEmail">Email:</label><br>
                <input type="email" id="appEmail" name="appEmail" required><br><br>
                
                <label for="appCourse">Course:</label><br>
                <select id="appCourse" name="appCourse" required>
                    <option value="btech">B.Tech CSE</option>
                    <option value="bca">BCA</option>
                </select><br><br>
                
                <label for="appStatement">Statement:</label><br>
                <textarea id="appStatement" name="appStatement" rows="5" cols="40" required></textarea><br><br>
                
                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>
    
    <footer align="center">
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
