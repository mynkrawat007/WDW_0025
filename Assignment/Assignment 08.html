<html>
    <head>
        <title>Hyperlinks and Images with Attributes</title>
    </head>
    <body>

        Links Demo
        <br><br>

        <!-- External Link -->
        <a href="https://www.google.com">External Link</a>
        <br>

        <!-- Internal Link -->
        <a href="#bottom">Jump to Bottom</a>
        <br>

        <!-- Email Link -->
        <a href="mailto:example@example.com">Email Us</a>
        <br>

        <!-- Image with Link -->
        <a href="https://www.google.com">
            <img src="image.jpg" alt="logo" width="170" height="90">
        </a>
        <br><br><br><br><br><br><br><br><br><br>

        <!-- Bottom Section -->
        <p id="bottom"> <a href="#">Back to Top</a></p>
        
    </body>
</html>
